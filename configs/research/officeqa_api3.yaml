# THE THREE-ARM OfficeQA comparison on the hosted actor. ONE FILE FOR ALL THREE ARMS.
#
#   arm A  Original SkillOpt                 OFFICEQA_STAGE_REPORT_DIR unset -> the analyst prompt is
#                                            byte-identical to upstream's.
#   arm B  Action Contracts Only             OFFICEQA_STAGE_REPORT_CONDITION=LC_ACTION
#   arm C  Action Contracts + Stages         OFFICEQA_STAGE_REPORT_CONDITION=LC_STAGE
#
# The arms differ ONLY in those two environment variables, which the opt-in hook in skillopt/gradient/reflect.py
# reads. Keeping one config file is the strongest available guarantee that the optimizer call schedule, the edit
# budget, the gate, the splits and the scoring match across the arms.
#
#   target    = Qwen3.5-4B served by EmpirioLabs (openai_compatible backend, role prefix TARGET_)
#   optimizer = DeepSeek V4.1 Flash (openai_compatible backend, role prefix OPTIMIZER_)
#   tools     = OfficeQA's own document tools, executed locally in the rollout process, so no GPU is needed
#
# Supplied at runtime, never stored here:
#   TARGET_OPENAI_COMPATIBLE_API_KEY / OPTIMIZER_OPENAI_COMPATIBLE_API_KEY, --optimizer_model,
#   env.split_dir, env.data_dirs, OFFICEQA_LC_MODEL (the frozen contract model this arm-epoch runs under).
#
# WHAT IS NOT MATCHED to the A40 pilot, and cannot be. Same note as officeqa_api.yaml: FP8 weights and FP8 KV
# cache against the pilot's bfloat16, top_k / min_p / repetition_penalty unsendable through the chat schema, and a
# 262144 context against the pilot's 65536. Every one of those applies identically to all three arms.
_base_: officeqa_api.yaml

env:
  # Rule OQA-SEL-3, digest 117836ff4139...: train 24, val 24 (the whole released val split), test 60.
  # docs/research/OFFICEQA_FROZEN_SETS_V3.json
  split_mode: split_dir
  split_dir: ""               # supplied at submit time (OFFICEQA_SPLIT_DIR)
  data_dirs: []               # supplied at submit time (OFFICEQA_DOCS_DIR)
  search_mode: offline
  use_local_tools: true
  workers: 4
  max_tool_turns: 24
  max_completion_tokens: 16384
  limit: 0

train:
  num_epochs: 4
  # batch_size 40 is inherited and exceeds the 24 training questions, so ceil(24/40) = 1 step per epoch: one
  # ORDINARY skill update per epoch, which is what the comparison asks for. Unchanged from the A40 run, where the
  # same arithmetic over 12 questions also gave one step.

gradient:
  analyst_workers: 2

optimizer:
  # THE DEVIATION OF officeqa_api.yaml IS REVERSED HERE, for all three arms alike.
  #
  # The two-arm A40 run turned both of these OFF to keep exactly one skill modification per epoch. The user has
  # now asked for "paper-style gated slow updates and meta-skill for all three arms from epoch 2", so both are on
  # and the slow update is GATED rather than force-accepted:
  #
  #   use_slow_update true                  at epoch 1 the trainer injects an empty SLOW_UPDATE placeholder and
  #                                         makes no optimizer call; from epoch 2 it replays the previous epoch's
  #                                         skill and the current one over `slow_update_samples` training
  #                                         questions, asks the optimizer for consolidated guidance, and submits
  #                                         the result as a candidate.
  #   slow_update_gate_with_selection true  THE PAPER-STYLE PART. The slow-update candidate is scored on the same
  #                                         24-question selection set and accepted or rejected through the same
  #                                         validation gate as an ordinary step. With this false (the repo
  #                                         default) the guidance is force-injected into the current skill with no
  #                                         val pass at all, which is not what "gated" means.
  #   use_meta_skill true                   optimizer-side memory. It does not edit the skill. When the slow
  #                                         update has already built this epoch's comparison pairs it REUSES them,
  #                                         so turning it on beside the slow update costs one optimizer call per
  #                                         epoch and no extra rollout.
  #
  # Cost, which is why it is spelled out: each epoch from 2 onward adds 2 x slow_update_samples training
  # rollouts plus one 24-question gate rollout plus two optimizer calls, PER ARM. See section 6 of
  # docs/research/OFFICEQA_THREE_ARM_LAUNCH.md for the arithmetic.
  use_slow_update: true
  slow_update_gate_with_selection: true
  use_meta_skill: true
  # TEN PAIRS PER GATED SLOW UPDATE, against upstream's 20. Set by the user on 2026-11-17 after the size
  # question was settled by measurement rather than estimate.
  #
  # Why the number is not free. This repo DISABLES per-trajectory truncation in the slow update on purpose
  # (skillopt/optimizer/slow_update.py: "Truncation disabled: return the full text"), so the longitudinal prompt
  # carries BOTH trajectories of every comparison pair at full length. The size therefore depends on which pairs
  # the sampler happens to draw, not on the configuration alone.
  #
  # WHAT IS PROVEN. Job 66271290, 2026-11-17: a realistic ten-pair request rendered by this very code from saved
  # training traces was ACCEPTED by the configured endpoint - prompt_tokens 243,986, finish_reason "stop", 7,562
  # completion tokens, 3,235 characters of parsed guidance, $0.041 off-peak.
  #
  #   pairs   prompt, measured mix        every pair showing a trajectory   against the 243,986 proven
  #     4            92,230                        138,276                  inside always
  #     6           138,345                        207,414                  inside even at worst
  #    10     230,575 (MEASURED 243,986)            345,690                  measured mix proven; worst unproven
  #    20           461,150                        691,380                  far beyond anything tried
  #
  # The earlier "173,060-token envelope" in this file's history was never a limit - only the largest prompt this
  # project had happened to send. DeepSeek accepted 1.41x it. The real ceiling remains unknown.
  #
  # THEREFORE THE SIZE IS CHECKED BEFORE EACH SEND, not assumed. skillopt/optimizer/prompt_budget.py renders the
  # slow-update and meta-skill prompts, measures them, and if a draw lands above the conservative limit drops
  # comparison pairs by rule OQA-PB-1 (stable_success -> improved -> persistent_fail -> regressed, later-sampled
  # first) until it fits. The limit and the log are set by the job, identically in every arm:
  #
  #   SKILLOPT_OPTIMIZER_PROMPT_TOKEN_LIMIT=225000   225,000 + the full 16,384-token completion allowance
  #                                                  = 241,384, inside the 251,548 tokens job 66271290 processed
  #   SKILLOPT_OPTIMIZER_PROMPT_BUDGET_LOG=<file>    one line per checked prompt: pairs offered, pairs actually
  #                                                  sent, which were dropped, estimated size, and whether
  #                                                  guidance came back
  #
  # AFTER THE RUN, read that log and slow_update/epoch_NN/slow_result.json in every arm before reporting that a
  # gated slow update produced guidance. An over-large prompt is not fatal - run_slow_update catches the provider
  # error and the trainer records action "no_content" - but it would be reported, not hidden.
  slow_update_samples: 10
  # Upstream's default: keep every comparison pair, which also means `_build_longitudinal_pairs` never runs the
  # extra per-item top-up rollouts that policy "changed" would.
  longitudinal_pair_policy: mixed

evaluation:
  use_gate: true
  sel_env_num: 0              # the whole 24-question released val split
  # The held-out set is evaluated by a SEPARATE job over the DISTINCT selected skills, so that S0 is scored once
  # instead of once per arm and no skill is rolled out twice. research/officeqa/oqa_heldout.py --plan
  eval_test: false
